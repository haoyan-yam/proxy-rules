# 唯一的结构定义：规则顺序、规则集来源、策略及两端各自的 DNS。
# shadowrocket.conf 和 stash.stoverride 都由 scripts/build.py 从这里生成，不要手改这两个文件。
#
# policy 取值：proxy / direct / reject / apple（🍎 苹果服务，可切换）
# source：personal = 本仓库 rules/<name>.list；bm = blackmatrix7/ios_rule_script 的 <name> 目录
# domain_set：true 表示该规则集同时引用 *_Domain 大列表（DOMAIN-SET / behavior: domain）

# 两端直连域名共用国内加密 DNS；使用 IP 地址避免引导查询。
direct_dns:
  nameservers:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

# Stash 默认 DNS 经「🚀 节点选择」；域名 policy 按业务规则顺序生成。
# 普通常规上游仅允许 HTTPS + IP；MagicDNS 单独查询本机 Tailscale。
stash_dns:
  nameservers:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
  # 独立 Tailscale 客户端保持运行，Use Tailscale DNS settings 关闭。
  # 只处理自己的 tailnet，不能将全部 ts.net 或普通网站交给 Quad100。
  magicdns:
    suffix: tail2bea5.ts.net
    nameserver: 100.100.100.100

# 仅 Stash：DNS 服务器 IP 规则之后、业务规则之前，固定使用 DIRECT。
# 不写入两端共用的个人规则，避免改变 Shadowrocket 内置 Tailscale 的现有行为。
# 端口规则适用于所有发往这些目标端口的连接，并不限于某个进程。
stash_direct_rules:
  - IP-CIDR,100.100.100.100/32,no-resolve
  - DOMAIN-SUFFIX,tail2bea5.ts.net
  - IP-CIDR,100.64.0.0/10,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,no-resolve
  - DOMAIN-SUFFIX,tailscale.com
  - DST-PORT,3478
  - DST-PORT,41641

# Shadowrocket 2.2.93 目标配置；待 iOS/iPadOS 实机验收。
# 默认/备用 DNS 加 #proxy；直连 DNS 使用上方 direct_dns，不加 #proxy。
# 节点域名独立使用国内 IP 形式 DoH 引导，不经代理，避免循环。
shadowrocket_dns:
  nameservers:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
  node_nameservers:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

rulesets:
  - {label: 局域网,        source: bm,       name: Lan,          policy: direct}
  - {label: 个人直连,      source: personal, name: personal_direct, policy: direct}
  - {label: 个人代理,      source: personal, name: personal_proxy,  policy: proxy}
  - {label: OpenAI,        source: bm,       name: OpenAI,       policy: proxy}
  - {label: Claude,        source: bm,       name: Claude,       policy: proxy}
  - {label: Gemini,        source: bm,       name: Gemini,       policy: proxy}
  - {label: Apple News,    source: bm,       name: AppleNews,    policy: proxy}
  - {label: Apple,         source: bm,       name: Apple,        policy: apple, domain_set: true}
  - {label: 海外常用,      source: bm,       name: Global,       policy: proxy, domain_set: true}
  - {label: 国内,          source: bm,       name: China,        policy: direct, domain_set: true}

# 兜底（固定）：GEOIP,CN → 直连；其余 → 代理
