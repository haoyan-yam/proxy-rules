# 唯一的结构定义：规则顺序、规则集来源、策略和 Stash 专用 DNS。
# shadowrocket.conf 和 stash.stoverride 都由 scripts/build.py 从这里生成，不要手改这两个文件。
#
# policy 取值：proxy / direct / reject / apple（🍎 苹果服务，可切换）
# source：personal = 本仓库 rules/<name>.list；bm = blackmatrix7/ios_rule_script 的 <name> 目录
# domain_set：true 表示该规则集同时引用 *_Domain 大列表（DOMAIN-SET / behavior: domain）

# 仅影响 Stash；不改变 Shadowrocket 的 DNS。
# 常规 DNS 全部经「🚀 节点选择」，包括国内域名；可能影响国内 CDN 速度。
# 仅允许 HTTPS + IP 地址，避免解析 DNS 服务器域名产生循环依赖。
stash_dns:
  nameservers:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query

rulesets:
  - {label: 局域网,        source: bm,       name: Lan,          policy: direct}
  - {label: 个人直连,      source: personal, name: personal_direct, policy: direct}
  - {label: 个人代理,      source: personal, name: personal_proxy,  policy: proxy}
  - {label: OpenAI,        source: bm,       name: OpenAI,       policy: proxy}
  - {label: Claude,        source: bm,       name: Claude,       policy: proxy}
  - {label: Gemini,        source: bm,       name: Gemini,       policy: proxy}
  - {label: Apple News,    source: bm,       name: AppleNews,    policy: proxy}
  - {label: Apple,         source: bm,       name: Apple,        policy: apple, domain_set: true}
  - {label: 海外常用,      source: bm,       name: Global,       policy: proxy, domain_set: true}
  - {label: 国内,          source: bm,       name: China,        policy: direct, domain_set: true}

# 兜底（固定）：GEOIP,CN → 直连；其余 → 代理
